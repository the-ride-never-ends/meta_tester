[project]
name = "meta-tester"
version = "1.0.0"
description = "Check pytest suites for test errors and rule violations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pytest",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.2.0",
    "pydantic>=2.8.1",
    "duckdb>=0.9.1",
    "PyYAML>=6.0",
    "pandas>=2.2.4",
]
[tool.poetry]
package-mode = false
